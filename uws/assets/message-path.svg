<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1A2E"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#818CF8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A5F3FC"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#22304A"/>
  </pattern>
</defs>
<rect width="960" height="400" rx="16" fill="url(#bg)"/>
<rect width="960" height="400" rx="16" fill="url(#dots)" opacity="0.55"/>
<rect x="0.5" y="0.5" width="959" height="399" rx="15.5" fill="none" stroke="#22304A"/>
<text x="40.0" y="52.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE" text-anchor="start" font-weight="600" letter-spacing="2">MESSAGE PATH</text>
<text x="40.0" y="80.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E6EDF6" text-anchor="start" font-weight="600">From frame to reply, in one turn</text>
<text x="920.0" y="80.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9BB4" text-anchor="end" font-weight="400">per connection, on uio's worker pool</text>
<rect x="40" y="124" width="196" height="150" rx="12" fill="#0E182B" stroke="#22304A" stroke-opacity="1" stroke-width="1"/>
<rect x="58" y="124" width="34" height="2" fill="#22D3EE"/>
<text x="58.0" y="152.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#22D3EE" text-anchor="start" font-weight="600" letter-spacing="1.2">01  UPGRADE</text>
<text x="58.0" y="176.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF6" text-anchor="start" font-weight="600">Handshake</text>
<text x="58.0" y="200.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">parsed natively by Serve,</text>
<text x="58.0" y="219.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">or hijacked from net/http</text>
<text x="58.0" y="238.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">then handed to uio</text>
<line x1="240" y1="199.0" x2="260" y2="199.0" stroke="#22D3EE" stroke-width="1.3" opacity="0.8"/>
<path d="M266,199.0 l-7,-4 v8 z" fill="#22D3EE"/>
<rect x="268" y="124" width="196" height="150" rx="12" fill="#0E182B" stroke="#22304A" stroke-opacity="1" stroke-width="1"/>
<rect x="286" y="124" width="34" height="2" fill="#22D3EE"/>
<text x="286.0" y="152.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#22D3EE" text-anchor="start" font-weight="600" letter-spacing="1.2">02  PARSE</text>
<text x="286.0" y="176.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF6" text-anchor="start" font-weight="600">Frames</text>
<text x="286.0" y="200.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">unmasked in place, text</text>
<text x="286.0" y="219.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">validated as UTF-8,</text>
<text x="286.0" y="238.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">inflated when negotiated</text>
<line x1="468" y1="199.0" x2="488" y2="199.0" stroke="#22D3EE" stroke-width="1.3" opacity="0.8"/>
<path d="M494,199.0 l-7,-4 v8 z" fill="#22D3EE"/>
<rect x="496" y="124" width="196" height="150" rx="12" fill="#0E182B" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="1.3"/>
<rect x="514" y="124" width="34" height="2" fill="#22D3EE"/>
<text x="514.0" y="152.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#22D3EE" text-anchor="start" font-weight="600" letter-spacing="1.2">03  HANDLE</text>
<text x="514.0" y="176.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF6" text-anchor="start" font-weight="600">OnMessage</text>
<text x="514.0" y="200.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">runs in the connection's</text>
<text x="514.0" y="219.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">turn; the payload is</text>
<text x="514.0" y="238.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">borrowed, not copied</text>
<line x1="696" y1="199.0" x2="716" y2="199.0" stroke="#22D3EE" stroke-width="1.3" opacity="0.8"/>
<path d="M722,199.0 l-7,-4 v8 z" fill="#22D3EE"/>
<rect x="724" y="124" width="196" height="150" rx="12" fill="#0E182B" stroke="#22304A" stroke-opacity="1" stroke-width="1"/>
<rect x="742" y="124" width="34" height="2" fill="#22D3EE"/>
<text x="742.0" y="152.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#22D3EE" text-anchor="start" font-weight="600" letter-spacing="1.2">04  REPLY</text>
<text x="742.0" y="176.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF6" text-anchor="start" font-weight="600">Batched write</text>
<text x="742.0" y="200.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">replies to a read's frames</text>
<text x="742.0" y="219.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">are encoded together and</text>
<text x="742.0" y="238.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A9BB4" text-anchor="start" font-weight="400">leave in one write</text>
<rect x="40" y="308" width="300" height="60" rx="12" fill="#0E182B" stroke="#22304A"/>
<text x="58.0" y="334.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#E6EDF6" text-anchor="start" font-weight="600">your goroutines</text>
<text x="58.0" y="354.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8A9BB4" text-anchor="start" font-weight="400">SendText · SendBinary · Ping</text>
<path d="M340,338 H822.0 V282" fill="none" stroke="#818CF8" stroke-width="1.3" stroke-dasharray="4 5"/>
<path d="M822.0,276 l-4,8 h8 z" fill="#818CF8"/>
<text x="581.0" y="330.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8A9BB4" text-anchor="middle" font-weight="400">join the same queue, in order</text>
</svg>
