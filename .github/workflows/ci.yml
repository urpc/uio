name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - 1.25.x
          - 1.26.x
          - 1.27.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet stdio transport
        if: runner.os != 'Windows'
        run: go vet -tags stdio ./...

      - name: Test stdio transport
        if: runner.os != 'Windows'
        run: go test -tags stdio ./...

      - name: Race test stdio transport
        if: runner.os != 'Windows'
        run: go test -race -tags stdio ./...
